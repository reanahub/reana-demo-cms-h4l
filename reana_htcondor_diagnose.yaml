# Runs htcondor_diagnose.sh on the farm with the real CMSSW image and the real
# inputs, to find which stage of a chunk job breaks there. The script reports
# every stage and always exits successfully, so the logs come back regardless.
#
# Uses the same image as the analysis rather than a stand-in: the earlier
# busybox test failed only because that image has no /bin/bash for the wrapper
# script, which looked like a workspace problem and cost a day.
version: 0.8.0
inputs:
  files:
    - htcondor_diagnose.sh
  directories:
    - code
outputs:
  files:
    - results/diagnose.txt
workflow:
  type: serial
  specification:
    steps:
      - name: diagnose
        environment: "docker.io/cmsopendata/cmssw_5_3_32"
        compute_backend: htcondorcern
        commands:
          - bash htcondor_diagnose.sh
