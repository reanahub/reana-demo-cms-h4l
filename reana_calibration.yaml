version: 0.8.0
inputs:
  directories:
    - code
    - data
  files:
    - workflow/calibration_file.txt
outputs:
  files:
    - results/calibration_timing.txt
workflow:
  type: serial
  specification:
    steps:
      - name: calibrate
        environment: "docker.io/cmsopendata/cmssw_5_3_32"
        commands:
          - source /opt/cms/cmsset_default.sh && scramv1 project CMSSW
            CMSSW_5_3_32 && cd CMSSW_5_3_32/src && eval `scramv1 runtime -sh` &&
            cp -r ../../code/HiggsExample20112012 . && cd
            HiggsExample20112012/HiggsDemoAnalyzer && scram b && cd ../Level4 &&
            mkdir -p ../../../../results && cp
            ../../../../workflow/calibration_file.txt this_chunk_index.txt &&
            sed -e
            's|/home/cms-opendata/CMSSW_5_3_32/src/Demo/DemoAnalyzer/datasets/CMS_Run2012C_DoubleMuParked_AOD_22Jan2013-v1_10000_file_index.txt|this_chunk_index.txt|'
            -e
            's|/home/cms-opendata/CMSSW_5_3_32/src/Demo/DemoAnalyzer/datasets/Cert_190456-208686_8TeV_22Jan2013ReReco_Collisions12_JSON.txt|../../../../data/Cert_190456-208686_8TeV_22Jan2013ReReco_Collisions12_JSON.txt|'
            -e "s|'HiggsDemoAnalyzer'|'HiggsDemoAnalyzerGit'|"
            demoanalyzer_cfg_level4data.py > demoanalyzer_cfg_calibration.py &&
            START=$$(date +%s) && cmsRun demoanalyzer_cfg_calibration.py &&
            END=$$(date +%s) && echo "DURATION_SECONDS=$$((END-START))" | tee
            ../../../../results/calibration_timing.txt
